# Artificial Intelligence — A Comprehensive Course
# MkDocs Material configuration for the public course website.

site_name: Artificial Intelligence — A Comprehensive Course
site_description: >-
  A university-level, beginner-to-advanced artificial intelligence course with sequenced lessons,
  Python notebooks, practical laboratories, assessments, projects and a capstone.
site_author: Muhammad Nadeem Majeed
site_url: https://nadeem-majeedch.github.io/Artificial-Intelligence-Course/
repo_url: https://github.com/nadeem-majeedch/Artificial-Intelligence-Course
repo_name: nadeem-majeedch/Artificial-Intelligence-Course

docs_dir: .site-build/docs
site_dir: site
strict: true
use_directory_urls: true

copyright: >-
  Copyright © 2026 Muhammad Nadeem Majeed · Educational content CC BY 4.0 · Source code MIT

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/name:scripts.site_slugify.github_slugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  course-home.md
  CONTENT-LICENSE.md
  DATASET-LICENSE.md
  LICENSING-INVENTORY.md
  THIRD-PARTY-ATTRIBUTIONS.md
  docs/ARCHITECTURE.md
  docs/AUDIT.md
  docs/IMPLEMENTATION-ROADMAP.md
  docs/index.md
  assessments/**
  modules/*/assignments/*.md
  modules/*/projects/*.md
  modules/*/quizzes/*.md
  modules/M14*/capstone/briefs/*.md
  modules/M14*/capstone/milestones.md
  modules/M14*/capstone/report-template.md
  modules/M14*/capstone/report-writing.md
  modules/M14*/capstone/rubric.md
  prerequisites/EXERCISES.md
  prerequisites/*/lessons/*.md
  prerequisites/*/labs/*.md
  resources/glossary/*.md
  resources/library/**/*.md


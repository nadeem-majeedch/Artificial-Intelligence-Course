name: Deploy course website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install pinned website dependencies
        run: python -m pip install --requirement requirements-pages.txt

      - name: Validate source content
        run: python audit/check_course.py

      - name: Stage the MkDocs source tree
        run: python scripts/stage_site.py

      - name: Build the website in strict mode
        run: python -m mkdocs build --strict

      - name: Check required pages, links and project-site base path
        run: python scripts/check_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
